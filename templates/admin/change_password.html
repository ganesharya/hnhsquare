{% extends "admin/base.html" %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Admin Password{% endblock %}
{% block content %}

<div class="dash-grid" style="max-width: 600px;">
    <div class="card">
        <div class="card-header">
            <h4>&#128274; Update Password</h4>
        </div>
        <div class="card-body">
            <form method="POST" action="/admin/change-password">
                <div class="form-group">
                    <label for="current_password">Current Password</label>
                    <input type="password" name="current_password" id="current_password" class="form-control" placeholder="Enter your current password" required>
                </div>
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" name="new_password" id="new_password" class="form-control" placeholder="Enter new password (min 6 chars)" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Re-enter new password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">Update Password</button>
                <a href="/admin/dashboard" class="btn btn-default" style="margin-left: 10px; background: var(--bg); color: var(--text);">Cancel</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
